        function syncAddress(routeUrl, replace) {
          var next = routeUrl.pathname + routeUrl.search + routeUrl.hash;
          var current = window.location.pathname + window.location.search + window.location.hash;
          if (next === current) return;

          if (replace) {
            window.history.replaceState({ miniapp: true }, "", next);
          } else {
            window.history.pushState({ miniapp: true }, "", next);
          }
        }

        function reportPageLoadError(route, error) {
          console.error("Unable to load embedded page:", route.file, error);
          screen.setAttribute("aria-busy", "false");
          screen.dataset.ready = "false";
          loading.textContent = "This page could not be loaded. Please reload and try again.";
        }

        function isPlanRoute(url, route) {
          var path = url.pathname.toLowerCase();
          var file = String(route.file || "").toLowerCase();
          return file === "pro.html" || file === "creator.html" || file === "root-pro.html" ||
            file === "root-creator.html" || path === "/pro" || path === "/creator" ||
            path.indexOf("/plans/pro") === 0 || path.indexOf("/plans/creator") === 0;
        }

        function showRoute(url, historyMode) {
          var route = resolveRoute(url);
          if (!route) {
            window.location.assign(url.href);
            return;
          }

          if (route.file.toLowerCase() === "login.html") {
            window.location.assign(url.href);
            return;
          }

          if (!isPlanRoute(url, route)) planReturnUrl = new URL(url.href);

          if (historyMode === "push") syncAddress(url, false);
          if (historyMode === "replace") syncAddress(url, true);

          if (route.file === currentFile && url.search === currentSearch && url.hash === currentHash &&
              (pendingFrame || activeFrame)) {
            return;
          }

          currentFile = route.file;
          currentSearch = url.search;
          currentHash = url.hash;
          screen.setAttribute("aria-busy", "true");
          screen.querySelectorAll('iframe[data-route-transition="exit"]').forEach(function (frame) {
            frame.remove();
          });

          var nextFrame = document.createElement("iframe");
          nextFrame.title = route.file.replace(/\.html$/i, "").replace(/[_-]/g, " ");
          nextFrame.style.visibility = "hidden";
          nextFrame.setAttribute("allow", "camera; microphone; clipboard-read; clipboard-write; fullscreen");
          nextFrame.setAttribute("referrerpolicy", "same-origin");
          var pageAssigned = false;
          nextFrame.addEventListener("load", function () {
            if (!pageAssigned || pendingFrame !== nextFrame) return;

            var previousFrame = activeFrame;
            activeFrame = nextFrame;
            pendingFrame = null;
            nextFrame.style.visibility = "visible";
            if (previousFrame && previousFrame !== nextFrame) {
              nextFrame.dataset.routeTransition = "enter";
              previousFrame.dataset.routeTransition = "exit";
              previousFrame.setAttribute("aria-hidden", "true");
              previousFrame.setAttribute("inert", "");
              var exitingFrame = previousFrame;
              window.setTimeout(function () {
                if (exitingFrame.parentNode) exitingFrame.remove();
              }, window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 190);
            }
            screen.dataset.ready = "true";
            screen.setAttribute("aria-busy", "false");

            try {
              if (nextFrame.contentDocument && nextFrame.contentDocument.title) {
                document.title = nextFrame.contentDocument.title;
              }
            } catch (error) {
              document.title = "Undress.app";
            }
          });

          if (pendingFrame) pendingFrame.remove();
          pendingFrame = nextFrame;
          screen.appendChild(nextFrame);
          pageDocumentForRoute(route).then(function (pageDocument) {
            if (pendingFrame !== nextFrame) return;
            pageAssigned = true;
            nextFrame.srcdoc = pageDocument;
          }).catch(function (error) {
            if (pendingFrame !== nextFrame) return;
            pendingFrame = null;
            nextFrame.remove();
            reportPageLoadError(route, error);
          });
        }

        function asLocalUrl(value) {
          var url = new URL(value, window.location.href);
          if (url.protocol !== "http:" && url.protocol !== "https:" &&
              url.protocol !== "mailto:" && url.protocol !== "tel:") return null;
          var isAppHost = url.hostname === "undress.app" || url.hostname === "www.undress.app";

          if (isAppHost) {
            var localUrl = new URL(url.pathname + url.search + url.hash, window.location.origin);
            return resolveRoute(localUrl) ? localUrl : url;
          }

          return url;
        }

        function navigateFromFrame(value) {
          var url;
          try {
            url = asLocalUrl(value);
          } catch (error) {
            return false;
          }
          if (!url) return false;

          var publicUrl = publicUrlForFrame(url);
          if (resolveRoute(publicUrl)) {
            showRoute(publicUrl, "push");
            return true;
          }

          window.location.assign(publicUrl.href);
          return true;
        }

        window.__miniappRouter = {
          navigate: navigateFromFrame,
          closePlan: function () {
            showRoute(new URL(planReturnUrl.href), "push");
          },
          openAccount: function () {
            if (activeFrame && activeFrame.contentWindow.__openAccountDialog) {
              activeFrame.contentWindow.__openAccountDialog();
              return;
            }
            showRoute(new URL("/Image.html", window.location.origin), "push");
          }
        };

        window.addEventListener("popstate", function () {
          showRoute(new URL(window.location.href), "none");
        });

        var initialUrl = new URL(window.location.href);
        var initialRoute = resolveRoute(initialUrl);
        if (!initialRoute) {
          initialUrl = new URL("/Image.html" + initialUrl.search + initialUrl.hash, window.location.origin);
          window.history.replaceState({ miniapp: true }, "", initialUrl.pathname + initialUrl.search + initialUrl.hash);
        }
        showRoute(initialUrl, "none");
      })();
